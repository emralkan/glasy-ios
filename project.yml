name: Glasy
options:
  bundleIdPrefix: com.emrealkan
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "6"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "11.0.0"
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    from: "5.0.0"
targets:
  Glasy:
    type: application
    platform: iOS
    sources:
      - path: Glasy
    dependencies:
      - package: GoogleMobileAds
      - package: RevenueCat
    info:
      path: Glasy/Info.plist
      properties:
        CFBundleDisplayName: Glasy
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        GADApplicationIdentifier: ca-app-pub-7795937092215431~9995820802
        NSUserTrackingUsageDescription: "İzninle sana daha alakalı reklamlar göstermek için kullanılır."
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emrealkan.glasy
        DEVELOPMENT_TEAM: N365493MUS
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Glasy:
    build:
      targets:
        Glasy: all
    run:
      config: Debug
      storeKitConfiguration: Products.storekit
    archive:
      config: Release
